<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عربي 101 — مركز المراجعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F1EAD9;
    --paper-2: #E9DFC8;
    --ink: #1E2B24;
    --ink-soft: #4A5A50;
    --teal: #0E4F45;
    --teal-2: #0B6E5C;
    --gold: #A9782F;
    --gold-soft: #C99A46;
    --rubric: #8C2F2F;
    --rubric-soft: #B24E42;
    --ok: #2E6B3E;
    --bad: #A23B2E;
    --card-shadow: 0 10px 30px -12px rgba(30,43,36,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(169,120,47,.08), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(140,47,47,.06), transparent 45%);
    color: var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3, .display{
    font-family:'Aref Ruqaa', serif;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  /* ===== decorative frame — echoes the manuscript border on the source pages ===== */
  .folio-border{
    position:relative;
    border:1px solid rgba(30,43,36,.18);
  }
  .folio-border::before{
    content:"";
    position:absolute; inset:6px;
    border:1px solid rgba(169,120,47,.35);
    pointer-events:none;
  }

  .wrap{max-width:1080px; margin:0 auto; padding:0 20px;}

  /* ===== HEADER ===== */
  header.top{
    padding:38px 20px 26px;
    text-align:center;
    position:relative;
  }
  .eyebrow{
    font-size:13px;
    letter-spacing:.12em;
    color:var(--rubric);
    font-weight:700;
    margin-bottom:10px;
  }
  header.top h1{
    font-size:44px;
    margin:0 0 8px;
    color:var(--teal);
    font-weight:700;
  }
  header.top p.sub{
    color:var(--ink-soft);
    font-size:15px;
    margin:0;
  }
  .rule{
    width:120px;height:3px;margin:18px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  /* ===== HOME GRID ===== */
  main.home{padding:10px 20px 70px;}
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap:18px;
    margin-top:30px;
  }
  .card{
    background: var(--paper);
    border-radius:2px;
    padding:22px 20px 20px;
    cursor:pointer;
    transition: transform .18s ease, box-shadow .18s ease;
    display:flex; flex-direction:column; gap:10px; min-height:150px;
  }
  .card:hover, .card:focus-visible{
    transform: translateY(-4px);
    box-shadow: var(--card-shadow);
    outline:2px solid var(--gold-soft);
    outline-offset:2px;
  }
  .card .num{
    font-family:'Aref Ruqaa', serif;
    font-size:15px;
    color:var(--rubric);
    font-weight:700;
  }
  .card h3{
    margin:0;
    font-size:22px;
    color:var(--teal);
    line-height:1.35;
  }
  .card .meta{
    margin-top:auto;
    font-size:12.5px;
    color:var(--ink-soft);
    display:flex; justify-content:space-between; align-items:center;
  }
  .card .meta .pill{
    background: rgba(14,79,69,.09);
    color:var(--teal-2);
    padding:3px 10px;
    border-radius:20px;
    font-weight:700;
  }
  .card .best{
    font-weight:700;
  }
  .card .best.hi{color:var(--ok);}
  .card .best.lo{color:var(--rubric-soft);}

  footer{
    text-align:center;
    padding:30px 20px 50px;
    color: var(--ink-soft);
    font-size:12.5px;
  }

  /* ===== QUIZ VIEW ===== */
  .quiz-shell{display:none; min-height:100vh; flex-direction:column;}
  .quiz-top{
    padding:16px 20px;
    display:flex; align-items:center; gap:14px;
    border-bottom:1px solid rgba(30,43,36,.12);
    position:sticky; top:0; background:var(--paper); z-index:5;
  }
  .back-btn{
    background:none; border:1px solid rgba(30,43,36,.25);
    padding:8px 14px; border-radius:20px; font-size:13px; cursor:pointer;
    color:var(--ink); flex-shrink:0;
  }
  .back-btn:hover{border-color:var(--teal);}
  .quiz-title{
    font-family:'Aref Ruqaa', serif;
    font-size:19px; color:var(--teal); flex:1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .progress-wrap{
    flex:2; height:8px; background:rgba(30,43,36,.1); border-radius:4px; overflow:hidden;
    min-width:80px;
  }
  .progress-bar{height:100%; background: linear-gradient(90deg, var(--gold), var(--teal-2)); width:0%; transition:width .3s;}
  .q-counter{font-size:13px; color:var(--ink-soft); flex-shrink:0; font-weight:700;}

  .quiz-body{
    flex:1;
    max-width:760px; width:100%; margin:0 auto;
    padding:36px 20px 60px;
  }
  .q-card{
    background:var(--paper);
    padding:28px 24px;
    position:relative;
  }
  .q-num-badge{
    font-family:'Aref Ruqaa', serif;
    color:var(--rubric); font-size:14px; font-weight:700; margin-bottom:14px;
  }
  .q-text{
    font-size:20px; line-height:1.7; color:var(--ink); margin-bottom:24px; font-weight:500;
  }
  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px;
    border:1.5px solid rgba(30,43,36,.2);
    border-radius:6px;
    cursor:pointer;
    background: rgba(255,255,255,.35);
    font-size:16px;
    transition: border-color .15s, background .15s;
    text-align:right;
  }
  .opt:hover{border-color:var(--teal-2);}
  .opt .letter{
    width:26px;height:26px;border-radius:50%;
    background:rgba(30,43,36,.08);
    display:flex;align-items:center;justify-content:center;
    font-size:13px; font-weight:700; flex-shrink:0; color:var(--ink-soft);
  }
  .opt.correct{border-color:var(--ok); background:rgba(46,107,62,.12);}
  .opt.correct .letter{background:var(--ok); color:#fff;}
  .opt.wrong{border-color:var(--bad); background:rgba(162,59,46,.1);}
  .opt.wrong .letter{background:var(--bad); color:#fff;}
  .opt.disabled{cursor:default;}

  .nav-row{
    display:flex; justify-content:space-between; align-items:center; margin-top:26px;
  }
  .next-btn{
    background:var(--teal); color:#fff; border:none; padding:12px 30px;
    border-radius:6px; font-size:15px; font-weight:700; cursor:pointer;
    opacity:.4; pointer-events:none; transition:opacity .2s;
  }
  .next-btn.active{opacity:1; pointer-events:auto;}
  .next-btn:hover.active{background:var(--teal-2);}
  .hint{font-size:13px; color:var(--ink-soft);}

  /* ===== RESULT VIEW ===== */
  .result-card{
    text-align:center;
    padding:50px 30px;
  }
  .result-card .score-num{
    font-family:'Aref Ruqaa', serif;
    font-size:72px; color:var(--teal); font-weight:700; line-height:1;
  }
  .result-card .score-out{font-size:20px; color:var(--ink-soft); margin-top:6px;}
  .result-card .verdict{
    margin-top:18px; font-size:18px; font-weight:700;
  }
  .verdict.hi{color:var(--ok);}
  .verdict.mid{color:var(--gold);}
  .verdict.lo{color:var(--rubric);}
  .result-actions{display:flex; gap:12px; justify-content:center; margin-top:30px; flex-wrap:wrap;}
  .btn{
    padding:12px 24px; border-radius:6px; font-size:14px; font-weight:700; cursor:pointer; border:1.5px solid transparent;
  }
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{background:var(--teal-2);}
  .btn-outline{background:none; border-color:rgba(30,43,36,.3); color:var(--ink);}
  .btn-outline:hover{border-color:var(--teal);}

  .review-list{margin-top:40px; text-align:right;}
  .review-list h4{font-family:'Aref Ruqaa',serif; color:var(--teal); font-size:20px; margin-bottom:16px; text-align:center;}
  .review-item{
    padding:16px; border-radius:6px; margin-bottom:10px;
    border:1px solid rgba(30,43,36,.15);
  }
  .review-item .rq{font-weight:700; margin-bottom:8px;}
  .review-item .ra{font-size:14px; margin:3px 0;}
  .review-item .ra.your{color:var(--bad);}
  .review-item .ra.correct{color:var(--ok);}

  @media (max-width:600px){
    header.top h1{font-size:32px;}
    .q-text{font-size:18px;}
    .quiz-title{display:none;}
    .result-card .score-num{font-size:56px;}
  }

  [hidden]{display:none !important;}
</style>
</head>
<body>

<div id="home-view">
  <header class="top">
    <div class="eyebrow">مركز اللغات — مادة اللغة العربية (101)</div>
    <h1>مراجعة عربي 101</h1>
    <p class="sub">تسعة عشر درساً · خمسون سؤالاً لكل درس · اختر الدرس وابدأ الامتحان</p>
    <div class="rule"></div>
  </header>
  <main class="home">
    <div class="wrap">
      <div class="grid" id="cards-grid"></div>
    </div>
  </main>
  <footer>مادة إعداد د. محمد عوض السعود — مركز اللغات، جامعة العلوم الإسلامية العالمية</footer>
</div>

<div class="quiz-shell" id="quiz-view">
  <div class="quiz-top">
    <button class="back-btn" id="back-btn">◂ رجوع</button>
    <div class="quiz-title" id="quiz-title-el"></div>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="q-counter" id="q-counter"></div>
  </div>
  <div class="quiz-body" id="quiz-body"></div>
</div>

<script>
const LESSON_ORDER = ["hamza", "tarqim", "maajim", "tazawwuq", "balagha_aam", "tibaq_jinas", "tashbih", "istiara", "fail_mafool", "marra_haia", "makan_zaman", "mubtada_khabar", "kan", "inna", "muthanna", "jamie_muthakkar", "jamie_muannath", "adad", "asma_khamsa", "mamnou_sarf"];
const LESSONS = {"hamza": {"title": "الهمزة والإملاء", "questions": [{"q": "همزة الوصل هي التي:", "options": ["تُكتب ولا تُنطق أبداً", "تُكتب على صورة (ا) ولا تُنطق في درج الكلام", "تُنطق دائماً مهما كان موقعها", "لا تُكتب ولا تُنطق"], "answer": 1, "note": ""}, {"q": "همزة القطع هي التي:", "options": ["تُكتب على صورة (أ) أو (إ) وتُنطق دائماً", "لا تُنطق إلا في أول الكلام", "تسقط دائماً من النطق", "تُكتب ولا ترسم"], "answer": 1, "note": ""}, {"q": "أقسام الهمزة بحسب موقعها من الكلمة:", "options": ["همزة أول، ووسط، وآخر فقط", "همزة الوصل، والهمزة المتوسطة، والهمزة المتطرفة", "همزة القطع فقط", "همزة ساكنة ومتحركة فقط"], "answer": 1, "note": ""}, {"q": "لمعرفة كون همزة الأمر همزة وصل، نرجع الفعل إلى:", "options": ["المضارع المجزوم", "الماضي الذي اشتق منه لنعرف نوعه (ثلاثي أم غيره)", "اسم الفاعل", "المصدر الميمي فقط"], "answer": 1, "note": ""}, {"q": "همزة (ابن، ابنة، اسم، اثنان، اثنتان، امرؤ، امرأة، ايمن الله) هي:", "options": ["همزة قطع دائماً", "همزة وصل من الأسماء السماعية", "همزة متطرفة", "همزة ممدودة"], "answer": 1, "note": ""}, {"q": "همزة فعل الأمر من الفعل الثلاثي (اكتبْ) هي:", "options": ["همزة قطع", "همزة وصل", "همزة متطرفة", "همزة ممدودة"], "answer": 1, "note": ""}, {"q": "همزة الفعل الماضي الخماسي وأمره ومصدره (مثل: اقتصدَ) هي:", "options": ["همزة قطع", "همزة وصل", "همزة ممدودة", "همزة متوسطة"], "answer": 1, "note": ""}, {"q": "همزة الفعل الماضي السداسي وأمره ومصدره (مثل: استخدمَ) هي:", "options": ["همزة قطع", "همزة وصل", "همزة متطرفة", "همزة مفردة"], "answer": 1, "note": ""}, {"q": "همزة (ال) التعريف عند اتصالها بالاسم مثل (الرجل) هي:", "options": ["همزة قطع", "همزة وصل", "همزة متطرفة", "همزة ممدودة"], "answer": 1, "note": ""}, {"q": "همزة القطع تكون في:", "options": ["الفعل الثلاثي مهموز الفاء نحو: أكل، أخذ", "فعل الأمر من الثلاثي فقط", "المصدر الخماسي", "همزة (ال) التعريف"], "answer": 0, "note": ""}, {"q": "همزة القطع في الفعل الماضي الرباعي المهموز ومصدره وأمره (مثل: أنجزَ) تكون:", "options": ["همزة وصل", "همزة قطع", "همزة متطرفة على السطر", "غير مرسومة" ": ["علم مختوم بألف ونون زائدتين", "علم مؤنث", "علم أعجمي", "صيغة منتهى الجموع"], "answer": 0, "note": ""}, {"q": "كلمة (بعلبك) ممنوعة من الصرف للسبب:", "options": ["العلم المركب تركيباً مزجياً", "علم مؤنث", "على وزن الفعل", "صيغة منتهى الجموع"], "answer": 0, "note": ""}, {"q": "كلمة (تغلب) ممنوعة من الصرف للسبب:", "options": ["جاءت على وزن الفعل (تُغلِب)", "علم مؤنث", "علم أعجمي", "مختوم بألف ونون زائدتين"], "answer": 0, "note": ""}, {"q": "كلمة (جرحى) ممنوعة من الصرف للسبب:", "options": ["اسم مختوم بألف مقصورة زائدة", "اسم مختوم بألف وهمزة زائدتين", "صفة على وزن أفعل", "صيغة منتهى الجموع"], "answer": 0, "note": ""}, {"q": "كلمة (أصدقاء) ممنوعة من الصرف للسبب:", "options": ["اسم مختوم بألف وهمزة زائدتين", "اسم مختوم بألف مقصورة", "على وزن الفعل", "علم مؤنث"], "answer": 0, "note": ""}, {"q": "كلمة (دراهم) ممنوعة من الصرف للسبب:", "options": ["صيغة منتهى الجموع", "علم مؤنث", "على وزن أفعل", "مختوم بألف ونون"], "answer": 0, "note": ""}, {"q": "كلمة (ثُلاث) من صفات الأعداد، ممنوعة من الصرف للسبب:", "options": ["صفات الأعداد على وزن فُعال ومَفعَل", "علم مؤنث", "صيغة منتهى الجموع", "على وزن الفعل"], "answer": 0, "note": ""}, {"q": "القاعدة العامة تنص على أن الممنوع من الصرف يُصرف (يُجرّ بالكسرة) في حالتين فقط هما التعريف بـ(ال) والإضافة، وفيما عدا ذلك يُجرّ:", "options": ["بالفتحة نيابة عن الكسرة", "بالضمة", "بالسكون", "بالواو"], "answer": 0, "note": ""}]}};

<script>
// ===================== STATE =====================
let currentLessonId = null;
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let answers = []; // {qIndex, chosen, correct}
let answered = false;

const STORAGE_KEY_PREFIX = 'arabi101_best_';

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function getBest(lessonId){
  try{
    const v = localStorage.getItem(STORAGE_KEY_PREFIX+lessonId);
    return v ? parseInt(v,10) : null;
  }catch(e){ return null; }
}
function setBest(lessonId, val){
  try{
    const cur = getBest(lessonId);
    if(cur===null || val>cur){ localStorage.setItem(STORAGE_KEY_PREFIX+lessonId, String(val)); }
  }catch(e){}
}

// ===================== HOME RENDER =====================
function renderHome(){
  const grid = document.getElementById('cards-grid');
  grid.innerHTML = '';
  LESSON_ORDER.forEach((id, idx) => {
    const lesson = LESSONS[id];
    const best = getBest(id);
    const card = document.createElement('div');
    card.className = 'card folio-border';
    card.tabIndex = 0;
    card.setAttribute('role','button');
    const numStr = String(idx+1).padStart(2,'0');
    card.innerHTML = `
      <div class="num">الدرس ${numStr}</div>
      <h3>${lesson.title}</h3>
      <div class="meta">
        <span class="pill">٥٠ سؤال</span>
        ${best!==null ? `<span class="best ${best>=35?'hi':'lo'}">أفضل نتيجة: ${best}/50</span>` : '<span></span>'}
      </div>
    `;
    card.addEventListener('click', () => startQuiz(id));
    card.addEventListener('keydown', (e) => { if(e.key==='Enter' || e.key===' ') startQuiz(id); });
    grid.appendChild(card);
  });
}

// ===================== QUIZ FLOW =====================
function startQuiz(lessonId){
  currentLessonId = lessonId;
  const lesson = LESSONS[lessonId];
  currentQuestions = shuffle(lesson.questions);
  currentIndex = 0;
  score = 0;
  answers = [];
  document.getElementById('home-view').hidden = true;
  document.getElementById('quiz-view').style.display = 'flex';
  document.getElementById('quiz-title-el').textContent = lesson.title;
  renderQuestion();
}

function backToHome(){
  document.getElementById('quiz-view').style.display = 'none';
  document.getElementById('home-view').hidden = false;
  renderHome();
}
document.getElementById('back-btn').addEventListener('click', backToHome);

function renderQuestion(){
  answered = false;
  const total = currentQuestions.length;
  const q = currentQuestions[currentIndex];
  document.getElementById('progress-bar').style.width = ((currentIndex)/total*100)+'%';
  document.getElementById('q-counter').textContent = `سؤال ${currentIndex+1} من ${total}`;

  const letters = ['أ','ب','ج','د'];
  // shuffle options but keep track of correct answer text
  const correctText = q.options[q.answer];
  const optOrder = shuffle(q.options.map((opt,i)=>({opt,i})));

  const body = document.getElementById('quiz-body');
  body.innerHTML = `
    <div class="q-card folio-border">
      <div class="q-num-badge">السؤال ${currentIndex+1}</div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="opts"></div>
      <div class="nav-row">
        <span class="hint" id="hint-text">اختر إجابة للمتابعة</span>
        <button class="next-btn" id="next-btn">${currentIndex+1===total ? 'إنهاء الامتحان' : 'السؤال التالي'} ◂</button>
      </div>
    </div>
  `;
  const optsEl = document.getElementById('opts');
  optOrder.forEach((entry, displayIdx) => {
    const btn = document.createElement('div');
    btn.className = 'opt';
    btn.innerHTML = `<span class="letter">${letters[displayIdx]}</span><span>${entry.opt}</span>`;
    btn.addEventListener('click', () => selectOption(btn, entry.opt, correctText));
    optsEl.appendChild(btn);
  });

  document.getElementById('next-btn').addEventListener('click', nextQuestion);
}

function selectOption(el, chosenText, correctText){
  if(answered) return;
  answered = true;
  const isCorrect = chosenText === correctText;
  if(isCorrect) score++;
  answers.push({
    q: currentQuestions[currentIndex].q,
    chosen: chosenText,
    correct: correctText,
    isCorrect
  });

  document.querySelectorAll('.opt').forEach(o => {
    o.classList.add('disabled');
    const txt = o.querySelector('span:last-child').textContent;
    if(txt === correctText) o.classList.add('correct');
    else if(txt === chosenText) o.classList.add('wrong');
  });
  document.getElementById('next-btn').classList.add('active');
  document.getElementById('hint-text').textContent = isCorrect ? 'إجابة صحيحة! 👍' : 'إجابة غير صحيحة — الصح موضّح أعلاه';
}

function nextQuestion(){
  if(!answered) return;
  currentIndex++;
  if(currentIndex >= currentQuestions.length){
    showResult();
  } else {
    renderQuestion();
  }
}

function showResult(){
  const total = currentQuestions.length;
  document.getElementById('progress-bar').style.width = '100%';
  document.getElementById('q-counter').textContent = `اكتمل`;
  setBest(currentLessonId, score);

  const pct = Math.round(score/total*100);
  let verdictClass = 'lo', verdictText = 'يحتاج مراجعة أكثر — كرر المحاولة 💪';
  if(pct>=85){ verdictClass='hi'; verdictText='ممتاز! إتقان كامل تقريباً 🌟'; }
  else if(pct>=60){ verdictClass='mid'; verdictText='جيد، بس فيه مجال للتحسين'; }

  const wrong = answers.filter(a=>!a.isCorrect);

  const body = document.getElementById('quiz-body');
  body.innerHTML = `
    <div class="q-card folio-border result-card">
      <div class="score-num">${score}<span style="font-size:32px;color:var(--ink-soft);">/${total}</span></div>
      <div class="score-out">نسبة النجاح: ${pct}%</div>
      <div class="verdict ${verdictClass}">${verdictText}</div>
      <div class="result-actions">
        <button class="btn btn-primary" id="retry-btn">إعادة المحاولة</button>
        <button class="btn btn-outline" id="home-btn">رجوع للرئيسية</button>
      </div>
      ${wrong.length ? `<div class="review-list">
        <h4>مراجعة الأخطاء (${wrong.length})</h4>
        ${wrong.map(w => `
          <div class="review-item">
            <div class="rq">${w.q}</div>
            <div class="ra your">إجابتك: ${w.chosen}</div>
            <div class="ra correct">الصحيح: ${w.correct}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </div>
  `;
  document.getElementById('retry-btn').addEventListener('click', () => startQuiz(currentLessonId));
  document.getElementById('home-btn').addEventListener('click', backToHome);
}

// ===================== INIT =====================
renderHome();
</script>
</body>
</html>
